# Bridge 运行配置示例（YAML）
# 启动方式示例：
#   go run ./cmd/cloud-bridge -config ./config.example.yaml
#
# 说明：
# 1) 本文件是“功能完整 + 安全默认值”示例，便于本地联调与部署参考。
# 2) 生产环境请替换管理账号密码，不要使用示例中的默认值。
# 3) 所有地址均为 Go 标准监听地址格式（如 ":39081"）。

ingress:
  # HTTP L7 入口监听地址（用于 host/path 路由流量）。
  http_addr: ":38080"
  # gRPC 入口监听地址（用于 gRPC 协议流量）。
  grpc_addr: ":38081"
  # HTTPS 入口监听地址。
  https_addr: ":8443"
  # TLS-SNI 入口监听地址。
  # 约束：必须与 https_addr 完全相同（共享同一 listener）。
  tls_sni_addr: ":8443"
  # L4 独立端口模式可分配范围，格式为 "start-end"。
  tcp_port_range: "9000-9100"

admin:
  # 管理面总开关。false 时不启动管理 API/UI。
  enabled: true
  # 管理面监听地址（Admin API + Admin UI）。
  listen_addr: ":39081"
  # 是否允许管理面与其他监听地址复用端口。
  # 建议保持 false（默认隔离），仅在特殊部署场景下设为 true。
  allow_shared_listener: false
  # 管理 UI 挂载路径前缀。
  # 例如 "/admin" 时，页面入口为 http://host:39081/admin/
  base_path: "/admin"
  # 是否启用管理 UI（API 仍受 enabled 控制）。
  ui_enabled: true
  # 管理面浏览器会话 cookie 名。
  session_cookie_name: "devbridge_admin_session"
  # 管理面写接口 CSRF 双提交中的 cookie 名。
  csrf_cookie_name: "devbridge_admin_csrf"
  # 管理面写接口 CSRF 双提交中的请求头名。
  csrf_header_name: "X-CSRF-Token"
  # 登录与写接口允许的来源 Origin 列表（服务端会校验 Origin/Referer）。
  # 示例：本地管理面地址。
  allowed_origins:
    - "http://127.0.0.1:39081"
    - "http://localhost:39081"
  # 管理面认证 provider 列表。
  # 当前首版仅实现本地用户名密码（type=password），后续预留 LDAP / OAuth 扩展位。
  auth_providers:
    - name: "local-password"
      type: "password"
      label: "本地账号"
      enabled: true
      password:
        accounts:
          # 只读账号：用于看板和查询页。
          - username: "viewer"
            password: "devbridge-viewer-pass"
            display_name: "Viewer"
            role: "viewer"
          # 运维账号：可执行受控运维命令。
          - username: "operator"
            password: "devbridge-operator-pass"
            display_name: "Operator"
            role: "operator"
          # 管理账号：可执行配置更新与导出。
          - username: "admin"
            password: "devbridge-admin-pass"
            display_name: "Admin"
            role: "admin"

observability:
  # 指标暴露监听地址（metrics endpoint）。
  metrics_addr: ":39090"
  # 日志级别（常用：debug / info / warn / error）。
  log_level: "info"

control_plane:
  # 控制面主监听地址（TCP framed 控制通道）。
  listen_addr: ":39080"
  # 控制面 gRPC H2 监听地址。
  # 约束：必须与 listen_addr 不同，避免端口冲突。
  grpc_h2_listen_addr: ":39082"
  # Session 心跳超时阈值。
  # 到达该时长未收到心跳会触发会话收敛（例如转为 STALE/CLOSED）。
  heartbeat_timeout: "30s"
  # Agent -> Bridge 控制面 TLS 接入模式：
  # - required: 仅允许 TLS
  # - optional: 允许 TLS 和明文
  # - plaintext: 仅允许明文
  tls_mode: "plaintext"
  # 当 tls_mode 为 required/optional 时，必须提供服务端证书和私钥。
  tls_cert_file: ""
  tls_key_file: ""
