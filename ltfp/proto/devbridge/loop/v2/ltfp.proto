syntax = "proto3";

package devbridge.loop.v2;

option go_package = "github.com/lifei6671/devbridge-loop/ltfp/pb/gen;ltfpgen";

message Scope {
  string namespace = 1;
  string environment = 2;
}

message ControlEnvelope {
  uint32 version_major = 1;
  uint32 version_minor = 2;
  string msg_type = 3;
  string request_id = 4;
  string session_id = 5;
  uint64 session_epoch = 6;
  string connector_id = 7;
  string resource_type = 8;
  string resource_id = 9;
  string event_id = 10;
  uint64 resource_version = 11;
  bytes payload = 12;
}

message ConnectorHello {
  string connector_id = 1;
  string namespace = 2;
  string environment = 3;
  string node_name = 4;
  string version = 5;
  repeated string supported_bindings = 6;
  repeated string capabilities = 7;
  map<string, string> labels = 8;
  map<string, string> metadata = 9;
}

message ConnectorWelcome {
  string selected_binding = 1;
  uint32 version_major = 2;
  uint32 version_minor = 3;
  uint32 heartbeat_interval_sec = 4;
  repeated string capabilities = 5;
  uint64 assigned_session_epoch = 6;
  map<string, string> metadata = 7;
  int32 tunnel_max_reuse_count = 8;
  uint32 tunnel_recycle_timeout_sec = 9;
  uint32 tunnel_idle_ttl_sec = 10;
}

message ConnectorAuth {
  string auth_method = 1;
  string token = 2;
  string client_cap_version = 3;
  map<string, string> metadata = 4;
}

message ConnectorAuthAck {
  bool success = 1;
  string session_id = 2;
  uint64 session_epoch = 3;
  string error_code = 4;
  string error_message = 5;
  map<string, string> metadata = 6;
}

message Heartbeat {
  int64 timestamp_unix = 1;
  string session_state = 2;
  string load_hint = 3;
  map<string, string> metadata = 4;
}

message ServiceEndpoint {
  string endpoint_id = 1;
  string protocol = 2;
  string host = 3;
  uint32 port = 4;
  string tls_mode = 5;
  string server_name = 6;
  uint32 dial_timeout_ms = 7;
  uint32 read_timeout_ms = 8;
  uint32 write_timeout_ms = 9;
  uint32 weight = 10;
  map<string, string> metadata = 11;
}

message ServiceExposure {
  string ingress_mode = 1;
  string host = 2;
  uint32 listen_port = 3;
  string sni_name = 4;
  string path_prefix = 5;
  bool allow_export = 6;
}

message HealthCheckConfig {
  string type = 1;
  string endpoint = 2;
  uint32 interval_sec = 3;
  uint32 timeout_sec = 4;
  uint32 healthy_threshold = 5;
  uint32 unhealthy_threshold = 6;
}

message DiscoveryPolicy {
  bool enabled = 1;
  repeated string providers = 2;
  string external_name = 3;
  string namespace = 4;
  string group = 5;
  map<string, string> tags = 6;
  map<string, string> metadata = 7;
}

message ServiceSelector {
  string logical_service_id = 1;
  string service_name = 2;
  Scope scope = 3;
  map<string, string> match_labels = 4;
  map<string, string> instance_labels = 5;
}

message HeaderMatcher {
  string name = 1;
  oneof match {
    string exact = 2;
    string prefix = 3;
    string regex = 4;
    bool present = 5;
  }
}

message QueryMatcher {
  string name = 1;
  oneof match {
    string exact = 2;
    string prefix = 3;
    string regex = 4;
    bool present = 5;
  }
}

message ScopeFallbackPolicy {
  string policy_id = 1;
  string namespace = 2;
  bool enabled = 3;
  repeated FallbackStep chain = 4;
  ExternalFallbackConfig external = 5;
}

message FallbackStep {
  Scope target_scope = 1;
}

message ExternalFallbackConfig {
  bool enabled = 1;
}

enum ScopeInjectPolicy {
  SCOPE_INJECT_POLICY_DISABLED = 0;
  SCOPE_INJECT_POLICY_ALWAYS = 1;
  SCOPE_INJECT_POLICY_MISSING_ONLY = 2;
}

message ScopeInjection {
  Scope inject_scope = 1;
  ScopeInjectPolicy inject_policy = 2;
}

message RouteHint {
  // 自动派生 HTTP/HTTPS Route 时追加的 Header 匹配条件。
  repeated HeaderMatcher match_headers = 1;
  // 自动派生 HTTP/HTTPS Route 时追加的 Query 匹配条件。
  repeated QueryMatcher match_queries = 2;
  // 自动派生 Route 的优先级；未填写时按 0 处理。
  uint32 priority = 3;
}

message PublishService {
  string instance_id = 1;
  string service_name = 2;
  Scope scope = 3;
  // labels 仅用于“选中 LogicalService 之后”的实例过滤，不应用来承载展示文案或观测扩展信息。
  map<string, string> labels = 4;
  // metadata 仅用于附加语义、观测和策略提示，不参与路由命中或实例过滤决策。
  map<string, string> metadata = 5;
  string service_type = 6;
  repeated ServiceEndpoint endpoints = 7;
  // exposure 定义入口挂载点；Bridge 会基于该信息决定是否派生对外 Route。
  ServiceExposure exposure = 8;
  HealthCheckConfig health_check = 9;
  DiscoveryPolicy discovery_policy = 10;
  // route_hint 仅用于补充自动派生 Route 的匹配条件，不替代 exposure 的 host/path 等入口定义。
  RouteHint route_hint = 11;
}

message PublishServiceAck {
  bool accepted = 1;
  string logical_service_id = 2;
  string instance_id = 3;
  string service_name = 4;
  Scope scope = 5;
  uint64 accepted_resource_version = 6;
  uint64 current_resource_version = 7;
  string error_code = 8;
  string error_message = 9;
}

message UnpublishService {
  string instance_id = 1;
  string logical_service_id = 2;
  string service_name = 3;
  Scope scope = 4;
  string reason = 5;
}

message UnpublishServiceAck {
  bool accepted = 1;
  string logical_service_id = 2;
  string instance_id = 3;
  uint64 accepted_resource_version = 4;
  uint64 current_resource_version = 5;
  string error_code = 6;
  string error_message = 7;
}

message EndpointHealthStatus {
  string endpoint_id = 1;
  string health_status = 2;
  string reason = 3;
}

message ServiceHealthReport {
  string instance_id = 1;
  string logical_service_id = 2;
  string service_health_status = 3;
  repeated EndpointHealthStatus endpoint_statuses = 4;
  int64 check_time_unix = 5;
  string reason = 6;
  map<string, string> metadata = 7;
}

message ConnectorServiceTarget {
  ServiceSelector selector = 1;
  map<string, string> instance_selector = 2;
  string load_balance_policy = 3;
}

message ExternalServiceTarget {
  string provider = 1;
  string namespace = 2;
  string environment = 3;
  string service_name = 4;
  string group = 5;
  map<string, string> selector = 6;
  uint32 cache_ttl_sec = 7;
  uint32 stale_if_error_sec = 8;
}

message RouteTarget {
  string type = 1;
  ConnectorServiceTarget connector_service = 2;
  ExternalServiceTarget external_service = 3;
}

message RouteMatch {
  string protocol = 1;
  string host = 2;
  string authority = 3;
  uint32 listen_port = 4;
  string path_prefix = 5;
  string sni = 6;
  repeated HeaderMatcher headers = 7;
  repeated QueryMatcher queries = 8;
}

message RouteAssign {
  string route_id = 1;
  Scope scope = 2;
  RouteMatch match = 3;
  RouteTarget target = 4;
  uint32 priority = 5;
  string policy_json = 6;
  map<string, string> metadata = 7;
  ScopeInjection scope_injection = 8;
}

message RouteAssignAck {
  bool accepted = 1;
  string route_id = 2;
  uint64 accepted_resource_version = 3;
  uint64 current_resource_version = 4;
  string error_code = 5;
  string error_message = 6;
  repeated string warnings = 7;
}

message RouteRevoke {
  string route_id = 1;
  Scope scope = 2;
  string reason = 3;
}

message RouteRevokeAck {
  bool accepted = 1;
  string route_id = 2;
  uint64 accepted_resource_version = 3;
  uint64 current_resource_version = 4;
  string error_code = 5;
  string error_message = 6;
}

message RouteStatusReport {
  string route_id = 1;
  string status = 2;
  string message = 3;
}

message NegotiationProfile {
  uint32 version_major = 1;
  uint32 version_minor = 2;
  repeated string required_features = 3;
  repeated string optional_features = 4;
  map<string, string> metadata = 5;
}

message NegotiationResult {
  bool accepted = 1;
  repeated string negotiated_features = 2;
  repeated string missing_required = 3;
  string error_code = 4;
  string error_message = 5;
  map<string, string> metadata = 6;
}

message ForwardIntent {
  string request_id = 1;
  string traffic_id = 2;
  string mode = 3;
  string namespace = 4;
  string environment = 5;
  string service_name = 6;
  string protocol_hint = 7;
  repeated string source_order = 8;
  NegotiationProfile negotiation_profile = 9;
  map<string, string> metadata = 10;
}

message ForwardDecision {
  bool accepted = 1;
  string request_id = 2;
  string traffic_id = 3;
  string mode = 4;
  string selected_source = 5;
  string selected_service_id = 6;
  string selected_route_id = 7;
  NegotiationResult negotiation_result = 8;
  string error_code = 9;
  string error_message = 10;
  map<string, string> metadata = 11;
}

message ControlError {
  string scope = 1;
  string code = 2;
  string message = 3;
  bool retryable = 4;
  map<string, string> metadata = 5;
}

message TrafficOpen {
  string traffic_id = 1;
  string route_id = 2;
  string logical_service_id = 3;
  string instance_id = 4;
  string source_addr = 5;
  string protocol_hint = 6;
  string trace_id = 7;
  map<string, string> endpoint_selection_hint = 8;
  map<string, string> metadata = 9;
}

message TrafficOpenAck {
  string traffic_id = 1;
  bool success = 2;
  string error_code = 3;
  string error_message = 4;
  map<string, string> metadata = 5;
}

message TrafficClose {
  string traffic_id = 1;
  string reason = 2;
}

message TrafficCloseAck {
  string traffic_id = 1;
  bool accepted = 2;
  string error_code = 3;
  string error_message = 4;
  map<string, string> metadata = 5;
}

message TrafficReset {
  string traffic_id = 1;
  string error_code = 2;
  string error_message = 3;
}

message TunnelRecycle {
  string tunnel_id = 1;
  uint64 recycle_seq = 2;
  bool is_final = 3;
  int32 completed_traffic_count = 4;
  map<string, string> metadata = 5;
}

message TunnelRecycleAck {
  string tunnel_id = 1;
  uint64 recycle_seq = 2;
  bool accepted = 3;
  string error_code = 4;
  string error_message = 5;
  map<string, string> metadata = 6;
}

message StreamPayload {
  oneof payload {
    TrafficOpen open_req = 1;
    TrafficOpenAck open_ack = 2;
    bytes data = 3;
    TrafficClose close = 4;
    TrafficCloseAck close_ack = 5;
    TrafficReset reset = 6;
    TunnelRecycle recycle = 7;
    TunnelRecycleAck recycle_ack = 8;
  }
}

service DevBridgeControlService {
  rpc ControlChannel(stream ControlEnvelope) returns (stream ControlEnvelope);
}

service DevBridgeTunnelService {
  rpc TunnelStream(stream StreamPayload) returns (stream StreamPayload);
}
